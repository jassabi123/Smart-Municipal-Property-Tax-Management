spring.application.name=property-tax-management
spring.datasource.url=jdbc:h2:mem:tax_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:smart-municipal-property-tax-management-system-super-secure-jwt-secret-key-2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
app.jwt.expiration-ms=28800000
app.jwt.admin-expiration-ms=86400000
app.jwt.staff-expiration-ms=43200000
app.seed-data=true
app.seed-password=Demo@1234
