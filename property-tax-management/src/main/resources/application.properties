spring.application.name=property-tax-management

# PostgreSQL DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tax_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_local_database_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# Disable open-in-view to prevent lazy-load issues masking real exceptions
spring.jpa.open-in-view=false

# Secrets must be supplied through the environment; safe dev fallback provided
app.jwt.secret=${JWT_SECRET:smart-municipal-property-tax-management-system-super-secure-jwt-secret-key-2026}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
app.jwt.expiration-ms=28800000
app.jwt.admin-expiration-ms=86400000
app.jwt.staff-expiration-ms=43200000

# Synthetic demo fixtures are enabled for local development only; set SEED_DATA=false in production.
app.seed-data=${SEED_DATA:true}
app.seed-password=${SEED_PASSWORD:Demo@1234}

# Mail Configuration (Spring Boot Mail)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
